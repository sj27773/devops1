apiVersion: v1
kind: Pod
metadata:
  name: mem1
  labels:
    name: mem
spec:
  containers:
  - name: mem
    image: polinux/stress
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
    ports:
    - containerPort: 8080
